name: Pixel snake 🐍

# Draws a snake eating the contribution graph, in the Naowal's Quest palette,
# and pushes the SVGs to the `output` branch (the README reads them from there).
on:
  schedule:
    - cron: "0 17 * * *" # daily at 00:00 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B4A&color_dots=#2A1F45,#3A2C5E,#C9BCEF,#FFC15E,#FF9EC4&color_dot_border=#1C1430&color_background=#1C1430
            dist/snake-light.svg?color_snake=#E2482A&color_dots=#F6E2C8,#C9BCEF,#FFC15E,#FF9EC4,#FF6B4A&color_dot_border=#FFF4E6&color_background=#FFF4E6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
